<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Предметы — Dota 2 Guide</title><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"><style>/* Специфичные стили для страницы предметов */
        .items-header {
            text-align: center;
            margin-bottom: 40px;
            padding-top: 20px;
        }

        .items-header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2rem, 5vw, 2.8rem);
        }

        .items-header h1 span {
            color: var(--gold);
            text-shadow: 0 0 30px var(--gold-glow);
        }

        .items-header p {
            color: #b0b0c0;
            font-size: 1.1rem;
            max-width: 600px;
            margin: 10px auto 0;
        }

        /* Категории предметов */
        .category-tabs {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 40px;
            padding: 0 10px;
        }

        .category-tab {
            padding: 10px 24px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.03);
            color: #8888a0;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .category-tab:hover {
            color: #fff;
            border-color: rgba(240, 185, 11, 0.3);
            background: rgba(240, 185, 11, 0.05);
        }

        .category-tab.active {
            background: rgba(240, 185, 11, 0.15);
            border-color: var(--gold);
            color: var(--gold);
            box-shadow: 0 0 30px rgba(240, 185, 11, 0.05);
        }

        /* Сетка предметов */
        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            opacity: 1;
            transition: opacity 0.4s ease;
        }

        .items-grid.fade-out {
            opacity: 0;
        }

        .items-grid.fade-in {
            opacity: 1;
        }

        /* Карточка предмета — без рамки, просто картинка */
        .item-card {
            background: rgba(20, 20, 30, 0.4);
            border-radius: 12px;
            padding: 15px 12px 14px;
            text-align: center;
            border: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            cursor: pointer;
            opacity: 0;
            transform: scale(0.9);
            animation: itemAppear 0.4s forwards;
        }

        .item-card:nth-child(1) { animation-delay: 0.02s; }
        .item-card:nth-child(2) { animation-delay: 0.04s; }
        .item-card:nth-child(3) { animation-delay: 0.06s; }
        .item-card:nth-child(4) { animation-delay: 0.08s; }
        .item-card:nth-child(5) { animation-delay: 0.10s; }
        .item-card:nth-child(6) { animation-delay: 0.12s; }
        .item-card:nth-child(7) { animation-delay: 0.14s; }
        .item-card:nth-child(8) { animation-delay: 0.16s; }
        .item-card:nth-child(9) { animation-delay: 0.18s; }
        .item-card:nth-child(10) { animation-delay: 0.20s; }
        .item-card:nth-child(11) { animation-delay: 0.22s; }
        .item-card:nth-child(12) { animation-delay: 0.24s; }
        .item-card:nth-child(13) { animation-delay: 0.26s; }
        .item-card:nth-child(14) { animation-delay: 0.28s; }
        .item-card:nth-child(15) { animation-delay: 0.30s; }
        .item-card:nth-child(16) { animation-delay: 0.32s; }
        .item-card:nth-child(17) { animation-delay: 0.34s; }
        .item-card:nth-child(18) { animation-delay: 0.36s; }
        .item-card:nth-child(19) { animation-delay: 0.38s; }
        .item-card:nth-child(20) { animation-delay: 0.40s; }

        @keyframes itemAppear {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }

        .item-card:hover {
            transform: translateY(-8px) scale(1.05);
            background: rgba(30, 30, 45, 0.6);
            box-shadow: 0 15px 40px rgba(240, 185, 11, 0.08);
            z-index: 5;
        }

        /* Просто прямоугольная картинка без рамки */
        .item-card .item-icon-wrap {
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: 8px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.4s;
            margin-bottom: 8px;
        }

        .item-card:hover .item-icon-wrap {
            transform: scale(1.02);
        }

        .item-card .item-icon-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s;
            display: block;
        }

        .item-card:hover .item-icon-wrap img {
            transform: scale(1.05);
        }

        .item-card .item-name {
            font-size: 0.85rem;
            font-weight: 600;
            color: #fff;
            line-height: 1.2;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .item-card .item-cost {
            font-size: 0.7rem;
            color: var(--gold);
            font-weight: 500;
        }

        /* Модальное окно для предметов */
        .item-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            z-index: 10000;
            justify-content: center;
            align-items: center;
            animation: modalFadeIn 0.3s;
            padding: 20px;
        }

        .item-modal.active {
            display: flex;
        }

        @keyframes modalFadeIn {
            0% { opacity: 0; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }

        .item-modal-content {
            background: rgba(15, 15, 25, 0.95);
            border: 1px solid rgba(240, 185, 11, 0.15);
            border-radius: 24px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.9);
        }

        .item-modal-content::-webkit-scrollbar {
            width: 6px;
        }

        .item-modal-content::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 4px;
        }

        .item-modal-content::-webkit-scrollbar-thumb {
            background: var(--gold);
            border-radius: 4px;
        }

        .item-modal-close {
            position: sticky;
            top: 0;
            float: right;
            background: none;
            border: none;
            color: #666;
            font-size: 2.2rem;
            transition: all 0.3s;
            z-index: 10;
            padding: 0 8px;
            line-height: 1;
            cursor: pointer;
        }

        .item-modal-close:hover {
            color: var(--gold);
            transform: rotate(90deg);
        }

        .item-modal-body {
            padding-top: 10px;
        }

        .item-modal-icon {
            width: 100%;
            max-height: 200px;
            border-radius: 12px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
        }

        .item-modal-icon img {
            width: 100%;
            height: auto;
            max-height: 200px;
            object-fit: contain;
            display: block;
        }

        .item-modal-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--gold);
            margin-bottom: 4px;
        }

        .item-modal-cost {
            font-size: 1rem;
            color: #8888a0;
            margin-bottom: 16px;
        }

        .item-modal-cost span {
            color: #fff;
            font-weight: 600;
        }

        .item-modal-desc {
            color: #b0b0c0;
            font-size: 0.95rem;
            line-height: 1.7;
            margin-bottom: 16px;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
            border-left: 3px solid rgba(240, 185, 11, 0.15);
        }

        .item-modal-recipe {
            margin-top: 12px;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .item-modal-recipe-title {
            font-size: 0.7rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .item-modal-recipe-items {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .item-modal-recipe-item {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.04);
            padding: 4px 12px 4px 4px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 0.8rem;
            color: #c8c8d0;
        }

        .item-modal-recipe-item img {
            width: 32px;
            height: 18px;
            object-fit: cover;
            border-radius: 3px;
            flex-shrink: 0;
        }

        .item-modal-badge {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: rgba(255, 255, 255, 0.05);
            color: #8888a0;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-top: 12px;
        }

        .no-items {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: #888;
            font-size: 1.2rem;
        }

        /* Адаптив */
        @media (max-width: 768px) {
            .items-grid {
                grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
                gap: 10px;
            }

            .item-card {
                padding: 10px 8px;
                border-radius: 8px;
            }

            .item-card .item-name {
                font-size: 0.7rem;
            }

            .item-card .item-cost {
                font-size: 0.6rem;
            }

            .category-tab {
                padding: 6px 14px;
                font-size: 0.7rem;
            }

            .item-modal-content {
                padding: 24px 18px;
                max-height: 92vh;
            }

            .item-modal-name {
                font-size: 1.4rem;
            }

            .item-modal-icon {
                max-height: 150px;
            }
        }

        @media (max-width: 480px) {
            .items-grid {
                grid-template-columns: repeat(auto-fill, minmax(85px, 1fr));
                gap: 8px;
            }

            .item-card {
                padding: 8px 6px;
                border-radius: 6px;
            }

            .item-card .item-icon-wrap {
                border-radius: 4px;
            }

            .item-card .item-name {
                font-size: 0.6rem;
            }

            .item-card .item-cost {
                font-size: 0.55rem;
            }

            .category-tab {
                padding: 4px 10px;
                font-size: 0.6rem;
            }

            .item-modal-content {
                padding: 16px 12px;
                border-radius: 16px;
            }

            .item-modal-name {
                font-size: 1.1rem;
            }

            .item-modal-desc {
                font-size: 0.85rem;
                padding: 10px 12px;
            }

            .item-modal-recipe-item {
                font-size: 0.7rem;
            }

            .item-modal-recipe-item img {
                width: 24px;
                height: 14px;
            }

            // ============================================================
            // ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
            // ============================================================
            function escapeHtml(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            function getItemIconName(itemId) {
                if (!itemId) return 'default';
                return itemId.toLowerCase().replace(/\s+/g, '_').replace(/'/g, '').replace(/[^a-z0-9_]/g, '');
            }

            function getItemIconUrl(itemId) {
                const iconName = getItemIconName(itemId);
                return `https://cdn.steamstatic.com/apps/dota2/images/items/${iconName}_lg.png`;
            }

            function formatCost(cost) {
                if (!cost || cost === 0) return 'Добывается';
                return cost + ' 💰';
            }

            function getAllItems() {
                const all = [];
                for (const [categoryKey, items] of Object.entries(ITEMS_DATA)) {
                    for (const item of items) {
                        all.push({
                            ...item,
                            categoryKey: categoryKey,
                            iconName: getItemIconName(item.id)
                        });
                    }
                }
                return all;
            }

            const allItems = getAllItems();

            // ============================================================
            // РЕНДЕР ПРЕДМЕТОВ
            // ============================================================
            const grid = document.getElementById('itemsGrid');
            const modal = document.getElementById('itemModal');
            const modalBody = document.getElementById('itemModalBody');
            const modalClose = document.getElementById('itemModalClose');

            function renderItems(category = 'all') {
                let filtered;
                if (category === 'all') {
                    filtered = allItems;
                } else {
                    filtered = allItems.filter(item => item.categoryKey === category);
                }

                if (filtered.length === 0) {
                    grid.innerHTML = '<div class="no-items"><p>Предметы в этой категории не найдены</p></div>';
                    grid.classList.remove('fade-out');
                    return;
                }

                // Анимация исчезновения
                grid.classList.add('fade-out');

                setTimeout(() => {
                    let html = '';
                    for (const item of filtered) {
                        const iconUrl = getItemIconUrl(item.id);
                        const costText = formatCost(item.cost);

                        html += `
                            <div class="item-card" 
                                 data-item-id="${escapeHtml(item.id)}"
                                 data-item-name="${escapeHtml(item.name)}"
                                 data-item-cost="${escapeHtml(item.cost)}"
                                 data-item-desc="${escapeHtml(item.desc)}"
                                 data-item-icon="${escapeHtml(item.iconName)}"
                                 data-item-recipe="${escapeHtml(JSON.stringify(item.recipe || []))}"
                                 data-item-category="${escapeHtml(item.category || '')}">
                                <div class="item-icon-wrap">
                                    <img src="${iconUrl}" alt="${escapeHtml(item.name)}" loading="lazy" 
                                         onerror="this.parentElement.innerHTML='<span style=\\'font-size:1.5rem;color:#666;\\'>?</span>'">
                                </div>
                                <div class="item-name">${escapeHtml(item.name)}</div>
                                <div class="item-cost">${costText}</div>
                            </div>
                        `;
                    }

                    grid.innerHTML = html;
                    grid.classList.remove('fade-out');
                    grid.classList.add('fade-in');

                    // Добавляем обработчики клика для модального окна
                    addClickHandlers();

                    setTimeout(() => {
                        grid.classList.remove('fade-in');
                    }, 400);
                }, 300);
            }

            // ============================================================
            // МОДАЛЬНОЕ ОКНО
            // ============================================================
            function openItemModal(itemId) {
                const item = allItems.find(i => i.id === itemId);
                if (!item) {
                    modalBody.innerHTML = '<p style="color:#ff6b6b;text-align:center;padding:20px;">Предмет не найден</p>';
                    modal.classList.add('active');
                    return;
                }

                const iconUrl = getItemIconUrl(item.id);
                const costText = formatCost(item.cost);

                let recipeHtml = '';
                if (item.recipe && item.recipe.length > 0) {
                    let recipeItemsHtml = '';
                    for (const recipeItemId of item.recipe) {
                        const recipeItem = allItems.find(i => i.id === recipeItemId);
                        const recipeIconUrl = recipeItem ? getItemIconUrl(recipeItem.id) : '';
                        const recipeName = recipeItem ? recipeItem.name : recipeItemId;
                        recipeItemsHtml += `
                            <div class="item-modal-recipe-item">
                                <img src="${recipeIconUrl}" alt="${escapeHtml(recipeName)}" 
                                     onerror="this.style.display='none'">
                                ${escapeHtml(recipeName)}
                            </div>
                        `;
                    }
                    recipeHtml = `
                        <div class="item-modal-recipe">
                            <div class="item-modal-recipe-title">🔨 Состав</div>
                            <div class="item-modal-recipe-items">${recipeItemsHtml}</div>
                        </div>
                    `;
                }

                modalBody.innerHTML = `
                    <div class="item-modal-icon">
                        <img src="${iconUrl}" alt="${escapeHtml(item.name)}" 
                             onerror="this.parentElement.innerHTML='<div style=\\'text-align:center;padding:40px;color:#666;font-size:3rem;\\'>?</div>'">
                    </div>
                    <div class="item-modal-name">${escapeHtml(item.name)}</div>
                    <div class="item-modal-cost">💰 <span>${costText}</span></div>
                    <div class="item-modal-desc">${escapeHtml(item.desc)}</div>
                    ${recipeHtml}
                    <span class="item-modal-badge">${escapeHtml(item.category || '')}</span>
                `;

                modal.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            function closeItemModal() {
                modal.classList.remove('active');
                document.body.style.overflow = '';
            }

            // Закрытие по клику вне контента
            modal.addEventListener('click', function(e) {
                if (e.target === this) {
                    closeItemModal();
                }
            });

            // Закрытие по кнопке
            modalClose.addEventListener('click', closeItemModal);

            // Закрытие по Escape
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && modal.classList.contains('active')) {
                    closeItemModal();
                }
            });

            // ============================================================
            // ОБРАБОТЧИКИ КЛИКОВ ДЛЯ КАРТОЧЕК
            // ============================================================
            function addClickHandlers() {
                const cards = document.querySelectorAll('.item-card');
                for (const card of cards) {
                    card.removeEventListener('click', cardClickHandler);
                    card.addEventListener('click', cardClickHandler);
                }
            }

            function cardClickHandler() {
                const id = this.dataset.itemId;
                if (id) {
                    openItemModal(id);
                }
            }

            // ============================================================
            // КАТЕГОРИИ (ТАБЫ)
            // ============================================================
            const tabs = document.querySelectorAll('.category-tab');

            for (const tab of tabs) {
                tab.addEventListener('click', function() {
                    for (const t of tabs) {
                        t.classList.remove('active');
                    }
                    this.classList.add('active');

                    const category = this.dataset.category;
                    renderItems(category);
                });
            }

            // ============================================================
            // ЗАПУСК
            // ============================================================
            document.addEventListener('DOMContentLoaded', function() {
                renderItems('all');
                console.log('✅ Страница предметов загружена, предметов:', allItems.length);
            });

        })();</script><script src="{{ url_for('static', filename='js/script.js') }}"></script></body></html>
